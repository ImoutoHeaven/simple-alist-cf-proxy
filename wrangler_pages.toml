name = "simple-alist-cf-proxy"
pages_build_output_dir = "./dist"
compatibility_date = "2024-01-01"

# Environment variables (configure in Cloudflare Dashboard or secrets)
# [vars]
# ENV="staging"
# ROLE="download"
# INSTANCE_ID="download-dev-1"
# APP_NAME="simple-alist-cf-proxy"
# APP_VERSION="dev"
# CONTROLLER_URL="https://controller.example.com"
# CONTROLLER_API_PREFIX="/api/v0"
# CONTROLLER_API_TOKEN="replace-with-token"
# BOOTSTRAP_CACHE_MODE="d1"
# CACHE_D1="CACHE_D1"
# INIT_TABLES="false"
# INTERNAL_API_TOKEN="replace-with-internal-token"
# INNER_AUTH_HEADER="X-Inner-Auth"
# INNER_AUTH_SECRET="replace-with-inner-auth-secret"

# Optional: D1 cache binding example
# [[d1_databases]]
# binding = "CACHE_D1"
# database_name = "controller_cache"
# database_id = "replace-with-id"
